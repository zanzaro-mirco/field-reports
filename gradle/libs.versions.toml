# Version catalog: le versioni stanno in un posto solo.
#
# Allineate alle correnti il 18 ottobre 2026, lette dai repository e non da un
# articolo. Una resta indietro apposta, con il motivo scritto accanto:
# `targetSdk`, in app/build.gradle.kts.
[versions]
agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.12"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
navigation = "2.10.2"
composeBom = "2026.09.00"
coroutines = "1.11.0"
serialization = "1.11.0"
retrofit = "3.0.0"
okhttp = "5.5.0"
desugar = "2.1.5"
room = "2.8.5"
junit = "4.13.2"
robolectric = "4.17"
androidxTest = "1.7.0"
roborazzi = "1.76.0"
turbine = "1.2.1"
hilt = "2.60.1"
hiltNavigationCompose = "1.4.0"
benchmark = "1.5.0"
profileinstaller = "1.4.1"
uiautomator = "2.4.0"
androidxTestJunit = "1.3.0"

