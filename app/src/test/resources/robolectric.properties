# Configurazione condivisa da tutti i test Robolectric.
#
# L'SDK è fissato invece di seguire il targetSdk: un test che cambia
# comportamento perché è cambiato il target del progetto è un test che mente.
sdk=34

# Roborazzi disegna davvero i pixel invece di simulare il canvas: senza questa
# riga gli screenshot uscirebbero vuoti.
graphicsMode=NATIVE
