name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Ferma alla v5, che è già su Node 24 e chiude l'avviso di
      # deprecazione. La v6 sposta la cache di Gradle in un componente
      # separato e non più open source, e usarla significa accettare i
      # Terms of Use di Gradle: è una decisione di licenza, non un
      # aggiornamento di routine.
      - uses: gradle/actions/setup-gradle@v5

      # `verifyRoborazziDebug` esegue tutta la suite di unit test e in più
      # confronta gli screenshot con i riferimenti versionati. Sostituisce
      # `test` invece di affiancarlo: eseguirli entrambi rifarebbe lo stesso
      # lavoro due volte.
      - name: Unit test e verifica screenshot
        run: ./gradlew verifyRoborazziDebug --no-daemon

      - name: Lint
        run: ./gradlew lint --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/outputs/roborazzi/
            app/build/outputs/apk/debug/*.apk
