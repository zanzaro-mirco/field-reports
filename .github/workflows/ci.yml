name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # `verifyRoborazziDebug` esegue tutta la suite di unit test e in più
      # confronta gli screenshot con i riferimenti versionati. Sostituisce
      # `test` invece di affiancarlo: eseguirli entrambi rifarebbe lo stesso
      # lavoro due volte.
      - name: Unit test e verifica screenshot
        run: ./gradlew verifyRoborazziDebug --no-daemon

      - name: Lint
        run: ./gradlew lint --no-daemon

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/outputs/roborazzi/
            app/build/outputs/apk/debug/*.apk
